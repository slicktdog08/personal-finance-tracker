# Builds the app image and publishes it to GitHub Container Registry, so people can run the
# tracker with `docker compose -f compose.selfhost.yml up -d` and never build anything.
#
#   push to main  -> ghcr.io/<owner>/personal-finance-tracker:latest (+ :sha-<commit>)
#   tag vX.Y.Z    -> :X.Y.Z and :X.Y
#   pull request  -> build only, nothing pushed (catches a broken Dockerfile before merge)
#
# The image carries no configuration or credentials — everything is supplied at run time.
# One-time step after the first publish: on GitHub, open the package's settings and set its
# visibility to Public so anonymous `docker pull` works.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, package.json, package-lock.json, scripts/docker-entrypoint.sh]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 covers Apple Silicon and Raspberry Pi hosts; QEMU builds it on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
